#cloud-config
# Pegar este contenido completo en el campo "Cloud config" al crear el servidor en Hetzner
# (Ubuntu 24.04). El servidor se instala solo en 5 a 8 minutos. Al terminar, el CRM queda en
# https://<IP-del-servidor>.sslip.io  (la IP aparece en la consola de Hetzner).
# Para usar dominio propio después: ver docs/DEPLOY.md, sección "Dominio".
package_update: true
packages:
  - git
  - curl
runcmd:
  # Servidor web mínimo en el puerto 80 que publica los registros desde el primer minuto (http://<IP>/install.log)
  - [ bash, -c, "mkdir -p /srv/status && touch /var/log/crm-install.log && ln -sf /var/log/crm-install.log /srv/status/install.log && ln -sf /var/log/cloud-init-output.log /srv/status/cloud-init.log && (nohup python3 -m http.server 80 --directory /srv/status >/dev/null 2>&1 &)" ]
  - [ bash, -c, "curl -fsSL https://raw.githubusercontent.com/digitalanke-debug/mi-app/claude/epic-tesla-80pp6u/deploy/install-hetzner.sh -o /root/install.sh" ]
  - [ bash, -c, "bash -x /root/install.sh https://github.com/digitalanke-debug/mi-app.git auto claude/epic-tesla-80pp6u > /var/log/crm-install.log 2>&1 || echo \"INSTALACION FALLO con codigo $?\" >> /var/log/crm-install.log" ]
